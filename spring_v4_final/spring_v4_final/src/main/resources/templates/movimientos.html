<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movimientos de Inventario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        *{ margin:0; padding:0; box-sizing:border-box; }
        body{
            background:
                radial-gradient(circle at top left,#1e3a8a 0%,transparent 25%),
                radial-gradient(circle at bottom right,#7c3aed 0%,transparent 25%),
                #0f172a;
            font-family:'Segoe UI',sans-serif; color:white; min-height:100vh;
        }
        .main{ margin-left:270px; padding:30px; }
        h2{ font-size:32px; font-weight:800;
            text-shadow:0 0 10px rgba(59,130,246,.7),0 0 20px rgba(124,58,237,.5); }

        /* CARD */
        .card{ background:rgba(255,255,255,.06); backdrop-filter:blur(20px);
            border-radius:24px; padding:28px; border:1px solid rgba(255,255,255,.08);
            box-shadow:0 15px 40px rgba(0,0,0,.25); }

        /* TABLA */
        .table{ color:#e2e8f0; border-collapse:separate; border-spacing:0 8px; }
        .table-light{
            --bs-table-color:#93c5fd !important;
            --bs-table-bg:transparent !important;
            --bs-table-border-color:rgba(255,255,255,.08) !important;
            background:transparent !important; color:#93c5fd !important;
        }
        .table > :not(caption) > * > *{ background-color:transparent !important; }
        .table thead th{ color:#93c5fd !important; font-size:12px; font-weight:700;
            text-transform:uppercase; letter-spacing:1px; padding:12px 14px;
            border:none; background:transparent; white-space:nowrap; }
        .table tbody tr{ background:rgba(255,255,255,.04); transition:.3s; }
        .table tbody tr:hover{ background:rgba(59,130,246,.1); }
        .table tbody td{ padding:12px 14px; font-size:13px; color:#e2e8f0 !important;
            border-color:rgba(255,255,255,.05); vertical-align:middle; }
        .table tbody tr:hover > td{ color:#e2e8f0 !important; }

        /* BADGES */
        .badge-entrada{ background:rgba(16,185,129,.2); color:#6ee7b7; padding:4px 12px;
            border-radius:20px; font-size:11px; font-weight:700; border:1px solid rgba(16,185,129,.3); }
        .badge-salida{ background:rgba(239,68,68,.2); color:#fca5a5; padding:4px 12px;
            border-radius:20px; font-size:11px; font-weight:700; border:1px solid rgba(239,68,68,.3); }

        /* INPUTS */
        .form-control, .form-select{
            background:rgba(255,255,255,.08) !important;
            border:1px solid rgba(255,255,255,.1) !important;
            color:white !important; border-radius:12px; padding:10px 14px; }
        .form-control:focus, .form-select:focus{
            background:rgba(255,255,255,.12) !important;
            border-color:#3b82f6 !important;
            box-shadow:0 0 0 3px rgba(59,130,246,.2) !important; }
        .form-control::placeholder{ color:#64748b; }
        .form-select option{ background:#1e293b; color:white; }

        /* BOTONES */
        .btn-primary{ background:linear-gradient(135deg,#2563eb,#7c3aed) !important;
            border:none !important; border-radius:14px !important; font-weight:700 !important; }
        .btn-primary:hover{ transform:translateY(-2px); box-shadow:0 8px 20px rgba(99,130,246,.3) !important; }
        .btn-secondary{ background:rgba(255,255,255,.08) !important;
            border:1px solid rgba(255,255,255,.1) !important; color:#94a3b8 !important; border-radius:12px !important; }
        .btn-info{ background:linear-gradient(135deg,#0ea5e9,#0284c7) !important;
            border:none !important; color:white !important; border-radius:10px; }
        /* MODAL */
        .modal-content{ background:#0f172a; border:1px solid rgba(255,255,255,.1);
            border-radius:24px; color:white; }
        .modal-header{ border-bottom:1px solid rgba(255,255,255,.08); padding:20px 24px; }
        .modal-title{ font-weight:800; font-size:20px; }
        .modal-footer{ border-top:1px solid rgba(255,255,255,.08); padding:14px 24px; gap:10px; }
        .btn-close{ filter:invert(1); }
        label{ color:#cbd5e1; font-size:13px; font-weight:600; }

        /* STOCK INFO */
        .stock-info{ background:rgba(59,130,246,.1); border:1px solid rgba(59,130,246,.2);
            border-radius:10px; padding:10px 14px; font-size:13px; color:#93c5fd;
            margin-top:8px; display:none; }

        @media(max-width:768px){
            .main{ margin-left:0; padding:16px; }
            .table thead th{ font-size:11px; padding:8px 10px; }
            .table tbody td{ padding:10px; font-size:12px; }
        }
    </style>
</head>
<body>

<div th:replace="fragments/sidebar :: sidebar"></div>

<div class="main">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fa-solid fa-arrow-right-arrow-left" style="font-size:26px;margin-right:10px;"></i>Movimientos de Inventario</h2>
        <button class="btn btn-primary" onclick="abrirNuevo()">
            <i class="fa-solid fa-plus"></i> Nuevo Movimiento
        </button>
    </div>

    <div class="card">
        <div class="mb-3 d-flex justify-content-end">
            <input type="text" id="buscar" placeholder="&#xf002;  Buscar..." class="form-control"
                   style="max-width:280px;" oninput="filtrar(this.value)">
        </div>

        <div style="overflow-x:auto;">
            <table class="table table-hover text-center align-middle" id="tablaMovimientos">
                <thead class="table-light">
                <tr>
                    <th>#</th>
                    <th><i class="fa-solid fa-box-open"></i> Producto</th>
                    <th><i class="fa-solid fa-arrows-up-down"></i> Tipo</th>
                    <th><i class="fa-solid fa-hashtag"></i> Cantidad</th>
                    <th><i class="fa-solid fa-user"></i> Usuario</th>
                    <th><i class="fa-solid fa-calendar"></i> Fecha y Hora</th>
                    <th><i class="fa-solid fa-comment"></i> Observación</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="m : ${movimientos}">
                    <td style="color:#64748b;" th:text="${m.id}"></td>
                    <td style="font-weight:700;" th:text="${m.producto.nombre}"></td>
                    <td>
                        <span th:if="${m.tipo == 'ENTRADA'}"  class="badge-entrada">▲ ENTRADA</span>
                        <span th:if="${m.tipo == 'SALIDA'}"   class="badge-salida">▼ SALIDA</span>
                        <span th:if="${m.tipo != 'ENTRADA' and m.tipo != 'SALIDA'}" th:text="${m.tipo}"></span>
                    </td>
                    <td style="font-weight:800; color:#60a5fa;" th:text="${m.cantidad}"></td>
                    <td>
                        <span th:if="${m.usuario != null}"
                              style="background:rgba(124,58,237,.2);color:#c4b5fd;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;"
                              th:text="${m.usuario}">
                        </span>
                        <span th:if="${m.usuario == null}" style="color:#64748b;">—</span>
                    </td>
                    <td style="color:#94a3b8; font-size:12px;"
                        th:text="${m.fecha != null ? #temporals.format(m.fecha,'dd/MM/yyyy HH:mm') : '—'}">
                    </td>
                    <td style="color:#94a3b8; font-size:12px; max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"
                        th:text="${m.observacion != null and !#strings.isEmpty(m.observacion) ? m.observacion : '—'}">
                    </td>
                    <td>
                        <!-- Ver detalle -->
                        <button class="btn btn-info btn-sm"
                                th:attr="data-id=${m.id},
                                         data-producto=${m.producto.nombre},
                                         data-tipo=${m.tipo},
                                         data-cantidad=${m.cantidad},
                                         data-usuario=${m.usuario ?: '—'},
                                         data-fecha=${m.fecha != null ? #temporals.format(m.fecha,'dd/MM/yyyy HH:mm') : '—'},
                                         data-obs=${m.observacion ?: '—'}"
                                onclick="verDetalle(this)"
                                title="Ver detalle">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(movimientos)}">
                    <td colspan="8" style="padding:40px;color:#64748b;">
                        <i class="fa-solid fa-inbox" style="font-size:32px;display:block;margin-bottom:10px;opacity:.4;"></i>
                        No hay movimientos registrados.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- ============================
     MODAL NUEVO MOVIMIENTO
============================= -->
<div class="modal fade" id="modalNuevo" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form id="formMovimiento" th:action="@{/movimientos/guardar}" method="post">
                <div class="modal-header"
                     style="background:linear-gradient(135deg,#0f172a,#1e293b);">
                    <h5 class="modal-title">
                        <i class="fa-solid fa-arrow-right-arrow-left" style="color:#3b82f6;"></i>
                        Nuevo Movimiento
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" style="padding:24px;">

                    <!-- PRODUCTO -->
                    <div class="mb-3">
                        <label><i class="fa-solid fa-box-open" style="color:#3b82f6;"></i> Producto <span style="color:#fca5a5;">*</span></label>
                        <select name="producto.id" id="selectProducto" class="form-select" required
                                onchange="mostrarStock(this)">
                            <option value="">— Selecciona un producto —</option>
                            <option th:each="p : ${productos}"
                                    th:value="${p.id}"
                                    th:text="${p.nombre} + ' (Stock: ' + ${p.stock} + ')'"
                                    th:attr="data-stock=${p.stock}">
                            </option>
                        </select>
                        <div class="stock-info" id="stockInfo">
                            <i class="fa-solid fa-cubes"></i>
                            Stock actual: <strong id="stockActualLabel">0</strong> unidades
                        </div>
                    </div>

                    <!-- TIPO -->
                    <div class="mb-3">
                        <label><i class="fa-solid fa-arrows-up-down" style="color:#f59e0b;"></i> Tipo <span style="color:#fca5a5;">*</span></label>
                        <select name="tipo" id="selectTipo" class="form-select" required>
                            <option value="">— Selecciona tipo —</option>
                            <option value="ENTRADA">▲ ENTRADA — Agrega stock</option>
                            <option value="SALIDA">▼ SALIDA — Reduce stock</option>
                        </select>
                    </div>

                    <!-- CANTIDAD -->
                    <div class="mb-3">
                        <label><i class="fa-solid fa-hashtag" style="color:#10b981;"></i> Cantidad <span style="color:#fca5a5;">*</span></label>
                        <input type="number" name="cantidad" id="inputCantidad"
                               class="form-control" min="1" placeholder="Ej: 10" required>
                        <div id="cantidadError" style="color:#fca5a5;font-size:12px;margin-top:4px;display:none;"></div>
                    </div>

                    <!-- OBSERVACIÓN -->
                    <div class="mb-1">
                        <label><i class="fa-solid fa-comment" style="color:#94a3b8;"></i> Observación <small style="color:#64748b;">(opcional)</small></label>
                        <textarea name="observacion" class="form-control" rows="2"
                                  placeholder="Ej: Compra a proveedor, ajuste de inventario..."></textarea>
                    </div>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="validarYGuardar()">
                        <i class="fa-solid fa-floppy-disk"></i> Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- ============================
     MODAL VER DETALLE
============================= -->
<div class="modal fade" id="modalDetalle" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header" style="background:linear-gradient(135deg,#0f172a,#1e293b);">
                <h5 class="modal-title">
                    <i class="fa-solid fa-circle-info" style="color:#3b82f6;"></i>
                    Detalle del Movimiento
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" style="padding:24px;">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">

                    <div style="background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px;">
                        <div style="font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;">Producto</div>
                        <div style="font-size:15px;font-weight:700;color:#e2e8f0;" id="dProducto">—</div>
                    </div>

                    <div style="background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px;">
                        <div style="font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;">Tipo</div>
                        <div id="dTipo">—</div>
                    </div>

                    <div style="background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px;">
                        <div style="font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;">Cantidad</div>
                        <div style="font-size:22px;font-weight:900;color:#60a5fa;" id="dCantidad">—</div>
                    </div>

                    <div style="background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px;">
                        <div style="font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;">Usuario</div>
                        <div style="font-size:14px;font-weight:700;color:#c4b5fd;" id="dUsuario">—</div>
                    </div>

                    <div style="background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px;grid-column:1/-1;">
                        <div style="font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;">Fecha y Hora</div>
                        <div style="font-size:14px;font-weight:700;color:#94a3b8;" id="dFecha">—</div>
                    </div>

                    <div style="background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px;grid-column:1/-1;" id="dObsWrap">
                        <div style="font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;">Observación</div>
                        <div style="font-size:13px;color:#e2e8f0;" id="dObs">—</div>
                    </div>

                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>

<script>
const modalNuevo   = new bootstrap.Modal(document.getElementById('modalNuevo'));
const modalDetalle = new bootstrap.Modal(document.getElementById('modalDetalle'));

// ── Abrir modal nuevo ──
function abrirNuevo() {
    document.getElementById('formMovimiento').reset();
    document.getElementById('stockInfo').style.display    = 'none';
    document.getElementById('cantidadError').style.display = 'none';
    modalNuevo.show();
}

// ── Mostrar stock del producto seleccionado ──
function mostrarStock(sel) {
    const opt   = sel.options[sel.selectedIndex];
    const stock = opt.getAttribute('data-stock');
    const info  = document.getElementById('stockInfo');
    if (stock !== null && sel.value !== '') {
        document.getElementById('stockActualLabel').textContent = stock;
        info.style.display = 'block';
    } else {
        info.style.display = 'none';
    }
}

// ── Validar y guardar ──
function validarYGuardar() {
    const producto  = document.getElementById('selectProducto').value;
    const tipo      = document.getElementById('selectTipo').value;
    const cantidad  = parseInt(document.getElementById('inputCantidad').value);
    const errEl     = document.getElementById('cantidadError');
    const opt       = document.getElementById('selectProducto').options[document.getElementById('selectProducto').selectedIndex];
    const stockAct  = parseInt(opt.getAttribute('data-stock') || '0');

    errEl.style.display = 'none';
    let ok = true;

    if (!producto) {
        Swal.fire({ icon:'warning', title:'Selecciona un producto', background:'#0f172a', color:'white', confirmButtonColor:'#6366f1' });
        return;
    }
    if (!tipo) {
        Swal.fire({ icon:'warning', title:'Selecciona el tipo de movimiento', background:'#0f172a', color:'white', confirmButtonColor:'#6366f1' });
        return;
    }
    if (!cantidad || cantidad <= 0) {
        errEl.textContent = 'La cantidad debe ser mayor a 0.';
        errEl.style.display = 'block';
        ok = false;
    }
    if (tipo === 'SALIDA' && cantidad > stockAct) {
        errEl.textContent = `Stock insuficiente. Stock disponible: ${stockAct} unidades.`;
        errEl.style.display = 'block';
        ok = false;
    }
    if (!ok) return;

    Swal.fire({
        title: '¿Confirmar movimiento?',
        html: `<b>${tipo}</b> de <b>${cantidad}</b> unidades de <b>${opt.text.split(' (Stock')[0]}</b>`,
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: 'Sí, guardar',
        cancelButtonText: 'Cancelar',
        confirmButtonColor: '#6366f1',
        background: '#0f172a',
        color: 'white'
    }).then(r => {
        if (r.isConfirmed) document.getElementById('formMovimiento').submit();
    });
}

// ── Ver detalle ──
function verDetalle(btn) {
    const tipo = btn.getAttribute('data-tipo');
    document.getElementById('dProducto').textContent  = btn.getAttribute('data-producto');
    document.getElementById('dCantidad').textContent  = btn.getAttribute('data-cantidad');
    document.getElementById('dUsuario').textContent   = btn.getAttribute('data-usuario');
    document.getElementById('dFecha').textContent     = btn.getAttribute('data-fecha');
    document.getElementById('dObs').textContent       = btn.getAttribute('data-obs');

    const tipoEl = document.getElementById('dTipo');
    if (tipo === 'ENTRADA') {
        tipoEl.innerHTML = '<span style="background:rgba(16,185,129,.2);color:#6ee7b7;padding:4px 14px;border-radius:20px;font-size:12px;font-weight:700;border:1px solid rgba(16,185,129,.3);">▲ ENTRADA</span>';
    } else {
        tipoEl.innerHTML = '<span style="background:rgba(239,68,68,.2);color:#fca5a5;padding:4px 14px;border-radius:20px;font-size:12px;font-weight:700;border:1px solid rgba(239,68,68,.3);">▼ SALIDA</span>';
    }

    modalDetalle.show();
}


// ── Filtrar tabla ──
function filtrar(valor) {
    const v = valor.toLowerCase();
    document.querySelectorAll('#tablaMovimientos tbody tr').forEach(fila => {
        fila.style.display = fila.textContent.toLowerCase().includes(v) ? '' : 'none';
    });
}
</script>

<script th:if="${error}">
Swal.fire({
    icon: 'error',
    title: 'Error',
    text: '[(${error})]',
    background: '#0f172a',
    color: 'white',
    confirmButtonColor: '#6366f1',
    confirmButtonText: 'Aceptar'
});
</script>

<script th:if="${success}">
Swal.fire({
    icon: 'success',
    title: '¡Listo!',
    text: '[(${success})]',
    background: '#0f172a',
    color: 'white',
    confirmButtonColor: '#6366f1',
    confirmButtonText: 'Aceptar'
});
</script>

<script src="/js/main.js"></script>
</body>
</html>
