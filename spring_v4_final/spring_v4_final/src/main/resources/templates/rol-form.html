<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f6f9;
            font-family:Segoe UI;
        }

        .card{
            width:600px;
            margin:50px auto;
            padding:30px;
            border:none;
            border-radius:15px;
            box-shadow:0 2px 8px rgba(0,0,0,.1);
        }
    </style>
</head>
<body>

<div class="card">

    <h3 class="mb-4 text-center"
        th:text="${rol.id == null ? 'Nuevo Perfil' : 'Editar Perfil'}">
    </h3>

    <form th:action="@{/roles/guardar}"
          th:object="${rol}"
          method="post">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label>Nombre</label>
            <input type="text"
                   class="form-control"
                   th:field="*{nombre}"
                   required>
        </div>

        <div class="mb-3">
            <label>Descripción</label>
            <input type="text"
                   class="form-control"
                   th:field="*{descripcion}">
        </div>

        <div class="mb-3">
            <label>Estado</label>
            <select class="form-control"
                    th:field="*{estado}">
                <option value="true">Activo</option>
                <option value="false">Inactivo</option>
            </select>
        </div>

        <button class="btn btn-success">
            Guardar
        </button>

        <a th:href="@{/roles}"
           class="btn btn-secondary">
            Volver
        </a>

    </form>

</div>

</body>
</html>
