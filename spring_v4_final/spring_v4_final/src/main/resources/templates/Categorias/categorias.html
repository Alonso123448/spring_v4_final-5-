<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Categorías</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        *{ margin:0; padding:0; box-sizing:border-box; }
        body{
            background:
                radial-gradient(circle at top left,#1e3a8a 0%,transparent 25%),
                radial-gradient(circle at bottom right,#7c3aed 0%,transparent 25%),
                #0f172a;
            font-family:'Segoe UI',sans-serif; color:white; min-height:100vh;
        }
        .main{ margin-left:270px; padding:30px; }
        .titulo{ font-size:32px; font-weight:800;
            text-shadow:0 0 10px rgba(59,130,246,.7),0 0 20px rgba(124,58,237,.5); }
        /* CARD */
        .card{ background:rgba(255,255,255,.06); backdrop-filter:blur(20px);
            border-radius:24px; border:1px solid rgba(255,255,255,.08);
            box-shadow:0 15px 40px rgba(0,0,0,.25); }
        h5.fw-bold{ color:white; font-size:18px; }
        /* TABLA */
        .table{ color:#e2e8f0; border-collapse:separate; border-spacing:0 8px; }
        .table-light{
            --bs-table-color: #93c5fd !important;
            --bs-table-bg: transparent !important;
            --bs-table-border-color: rgba(255,255,255,.08) !important;
            background:transparent !important; color:#93c5fd !important;
        }
        .table > :not(caption) > * > *{ background-color:transparent !important; }
        .table thead th{ color:#93c5fd !important; font-size:13px; font-weight:700;
            text-transform:uppercase; letter-spacing:1px; padding:12px 16px;
            border:none; background:transparent; }
        .table tbody tr{ background:rgba(255,255,255,.04); transition:.3s; }
        .table tbody tr:hover{ background:rgba(59,130,246,.1); }
        .table td, .table th{ vertical-align:middle; border-color:rgba(255,255,255,.05); }
        .table tbody td{ padding:13px 16px; font-size:14px; color:#e2e8f0 !important; }
        .table tbody tr:hover > td{ color:#e2e8f0 !important; }
        /* BADGES */
        .bg-success{ background:rgba(16,185,129,.2) !important; color:#6ee7b7 !important;
            padding:5px 14px; border-radius:20px; font-size:12px; font-weight:700;
            border:1px solid rgba(16,185,129,.3); }
        .bg-danger{ background:rgba(239,68,68,.2) !important; color:#fca5a5 !important;
            padding:5px 14px; border-radius:20px; font-size:12px; font-weight:700;
            border:1px solid rgba(239,68,68,.3); }
        .badge-activo{ background:rgba(16,185,129,.2); color:#6ee7b7; padding:5px 14px;
            border-radius:20px; font-size:12px; font-weight:700; border:1px solid rgba(16,185,129,.3); }
        /* BOTONES */
        .btn-primary{ background:linear-gradient(135deg,#2563eb,#7c3aed) !important;
            border:none !important; border-radius:14px !important; font-weight:700 !important; }
        .btn-primary:hover{ transform:translateY(-2px); box-shadow:0 8px 20px rgba(99,130,246,.3) !important; }
        .btn-info{ background:linear-gradient(135deg,#0ea5e9,#0284c7) !important;
            border:none !important; color:white !important; border-radius:10px; }
        .btn-warning{ background:linear-gradient(135deg,#f59e0b,#d97706) !important;
            border:none !important; color:white !important; border-radius:10px; }
        .btn-danger{ background:linear-gradient(135deg,#ef4444,#dc2626) !important;
            border:none !important; border-radius:10px; }
        /* CONTROLES */
        .form-control,.form-select{ background:rgba(255,255,255,.08) !important;
            border:1px solid rgba(255,255,255,.1) !important; color:white !important;
            border-radius:12px; padding:9px 14px; }
        .form-control:focus,.form-select:focus{ background:rgba(255,255,255,.12) !important;
            border-color:#3b82f6 !important; box-shadow:0 0 0 3px rgba(59,130,246,.2) !important; }
        .form-control::placeholder{ color:#64748b; }
        .form-select option{ background:#1e293b; color:white; }
        /* MODAL */
        .modal-content{ background:#0f172a; border:1px solid rgba(255,255,255,.1);
            border-radius:24px; color:white; }
        .modal-header{ border-bottom:1px solid rgba(255,255,255,.08); padding:20px 24px; }
        .modal-title{ font-weight:800; font-size:20px; }
        .modal-footer{ border-top:1px solid rgba(255,255,255,.08); }
        .btn-close{ filter:invert(1); }
        label{ color:#cbd5e1; font-size:13px; font-weight:600; }
        /* RESPONSIVE */
        @media(max-width:768px){
            .d-flex.justify-content-between{ flex-wrap:wrap; gap:12px; }
            .btn-primary{ width:100%; }
            .form-control.w-auto, .form-select.w-auto{ width:100% !important; }
            .table thead th{ font-size:11px; padding:8px 10px; }
            .table tbody td{ padding:10px; font-size:13px; }
        }
    </style>
</head>
<body>

<div th:replace="fragments/sidebar :: sidebar"></div>

<div class="main">
    <h2 class="titulo mb-4">Gestión de Categorías</h2>

    <div class="card p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 class="fw-bold">Listado de Categorías</h5>
            <button class="btn btn-primary" onclick="abrirNuevo()">+ Nueva Categoría</button>
        </div>

        <div class="d-flex justify-content-between mb-3">
            <div>
                Mostrar
                <select class="form-select d-inline w-auto">
                    <option>10</option>
                </select>
                registros
            </div>

            <div>
                Buscar:
                <input class="form-control d-inline w-auto" id="buscar">
            </div>
        </div>

        <table id="tablaCategorias" class="table table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Estado</th>
                <th class="text-center">Acciones</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="c : ${categorias}">
                <td th:text="${c.id}"></td>
                <td th:text="${c.nombre}"></td>
                <td th:text="${c.descripcion}"></td>
                <td>
                    <span th:if="${c.estado}" class="badge bg-success">Activo</span>
                    <span th:unless="${c.estado}" class="badge bg-danger">Inactivo</span>
                </td>
                <td class="text-center">
                    <!-- Editar -->
                    <button class="btn btn-info btn-sm" th:attr="onclick=|editarCategoria(${c.id})|">✏</button>
                    <!-- Ver -->
                    <button class="btn btn-warning btn-sm" th:attr="onclick=|verCategoria('${c.nombre}', '${c.descripcion}')|">👁</button>
                    <!-- Eliminar -->
                    <button class="btn btn-danger btn-sm" th:attr="onclick=|eliminarCategoria(${c.id})|">🗑</button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- MODAL -->
<div class="modal fade" id="categoriaModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/categorias/guardar}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title" id="tituloModal">Categoría</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <input type="hidden" id="categoriaId" name="id">
                    <div class="mb-3">
                        <label>Nombre</label>
                        <input type="text" class="form-control" id="nombre" name="nombre">
                    </div>
                    <div class="mb-3">
                        <label>Descripción</label>
                        <textarea class="form-control" id="descripcion" name="descripcion"></textarea>
                    </div>
                    <div class="mb-3">
                        <label>Estado</label>
                        <select class="form-control" id="estado" name="estado">
                            <option value="true">Activo</option>
                            <option value="false">Inactivo</option>
                        </select>
                    </div>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script th:inline="javascript">
const modal = new bootstrap.Modal(document.getElementById('categoriaModal'));

// Nuevo
function abrirNuevo(){
    document.getElementById("categoriaId").value = "";
    document.getElementById("nombre").value = "";
    document.getElementById("descripcion").value = "";
    document.getElementById("estado").value = "true";
    document.getElementById("tituloModal").innerText = "Nueva Categoría";
    modal.show();
}

// Editar
function editarCategoria(id){
    fetch('/categorias/buscar/' + id)
    .then(res => res.json())
    .then(data => {
        document.getElementById("categoriaId").value = data.id;
        document.getElementById("nombre").value = data.nombre;
        document.getElementById("descripcion").value = data.descripcion;
        document.getElementById("estado").value = data.estado;
        document.getElementById("tituloModal").innerText = "Editar Categoría";
        modal.show();
    });
}

// Ver con SweetAlert2
function verCategoria(nombre, descripcion){
    Swal.fire({
        title: nombre,
        text: descripcion,
        icon:'info',
        confirmButtonText: 'Cerrar'
    });
}

// Eliminar con SweetAlert2
function eliminarCategoria(id){
    Swal.fire({
        title:'¿Eliminar categoría?',
        text:'Esta acción no se puede deshacer',
        icon:'warning',
        showCancelButton:true,
        confirmButtonText:'Sí, eliminar',
        cancelButtonText:'Cancelar'
    }).then((result)=>{
        if(result.isConfirmed){
            const f=document.createElement('form');
            f.method='POST'; f.action="/categorias/eliminar/"+id;
            document.body.appendChild(f); f.submit();
        }
    });
}

// Buscador
document.getElementById("buscar").addEventListener("keyup", function() {
    let valor = this.value.toLowerCase();
    let filas = document.querySelectorAll("#tablaCategorias tbody tr");
    filas.forEach(fila => {
        fila.style.display = fila.textContent.toLowerCase().includes(valor) ? "" : "none";
    });
});

// Mostrar mensajes flash (error / success)
/*<![CDATA[*/
const _flashError = /*[[${error}]]*/ null;
const _flashSuccess = /*[[${success}]]*/ null;
if (_flashError) {
    Swal.fire({ icon:'error', title:'Error', text:_flashError, confirmButtonColor:'#6366f1' });
} else if (_flashSuccess) {
    Swal.fire({ icon:'success', title:'Listo', text:_flashSuccess, timer:2000, showConfirmButton:false });
}
/*]]>*/
</script>

<script src="/js/main.js"></script>

</body>
</html>
