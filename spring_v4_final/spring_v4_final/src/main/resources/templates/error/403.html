<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin Acceso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: radial-gradient(circle at top left,#1e3a8a 0%,transparent 25%),
                        radial-gradient(circle at bottom right,#7c3aed 0%,transparent 25%),#0f172a;
            font-family:'Segoe UI',sans-serif;
            color:white;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .error-card {
            background:rgba(255,255,255,.04);
            border:1px solid rgba(255,255,255,.08);
            border-radius:24px;
            padding:52px 48px;
            text-align:center;
            max-width:480px;
            width:90%;
            box-shadow:0 24px 60px rgba(0,0,0,.4);
        }
        .error-icon {
            width:90px; height:90px;
            border-radius:50%;
            background:rgba(239,68,68,.15);
            border:2px solid rgba(239,68,68,.3);
            display:flex;align-items:center;justify-content:center;
            margin:0 auto 28px;
            font-size:38px;
            color:#f87171;
        }
        .error-code {
            font-size:72px;
            font-weight:900;
            background:linear-gradient(135deg,#f87171,#ef4444);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            line-height:1;
            margin-bottom:8px;
        }
        .error-title {
            font-size:22px;
            font-weight:700;
            color:#e2e8f0;
            margin-bottom:12px;
        }
        .error-desc {
            font-size:14px;
            color:#94a3b8;
            line-height:1.7;
            margin-bottom:32px;
        }
        .btn-back {
            display:inline-flex;align-items:center;gap:8px;
            padding:12px 28px;
            border-radius:12px;
            background:linear-gradient(135deg,#2563eb,#7c3aed);
            color:white;font-size:14px;font-weight:700;
            text-decoration:none;border:none;cursor:pointer;
            transition:.2s;
        }
        .btn-back:hover { filter:brightness(1.15);color:white; }
        .badge-403 {
            display:inline-block;
            background:rgba(239,68,68,.15);
            border:1px solid rgba(239,68,68,.3);
            color:#fca5a5;
            font-size:12px;font-weight:700;
            padding:6px 16px;border-radius:20px;
            margin-bottom:20px;
            letter-spacing:1px;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-icon">
            <i class="fa-solid fa-lock"></i>
        </div>
        <div class="badge-403">SIN ACCESO</div>
        <div class="error-title" style="font-size:26px;margin-bottom:14px;">No tienes acceso a este módulo</div>
        <div class="error-desc">
            Tu usuario no tiene permiso para ver esta sección.<br>
            Contacta al administrador para que te habilite el acceso.
        </div>
        <a href="javascript:history.back()" class="btn-back">
            <i class="fa-solid fa-arrow-left"></i> Volver atrás
        </a>
    </div>
</body>
</html>
