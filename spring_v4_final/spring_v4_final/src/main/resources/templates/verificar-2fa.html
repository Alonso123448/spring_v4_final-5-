<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Verificación - Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Segoe UI", sans-serif;
        }
        .card-2fa {
            background: white;
            border-radius: 18px;
            padding: 40px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.25);
            width: 100%;
            max-width: 420px;
        }
        .icon-lock {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 28px;
        }
        .codigo-input {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 12px;
            text-align: center;
            border: 2px solid #667eea;
            border-radius: 12px;
            padding: 14px;
            color: #667eea;
            width: 100%;
            background: #f8f7ff;
        }
        .codigo-input:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 0 3px rgba(102,126,234,.2);
        }
        .btn-verificar {
            width: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-size: 15px;
            font-weight: 700;
            color: white;
            margin-top: 16px;
            cursor: pointer;
            transition: opacity .2s;
        }
        .btn-verificar:hover { opacity: .88; }
        .timer {
            font-size: 13px;
            color: #94a3b8;
            text-align: center;
            margin-top: 14px;
        }
        .timer span {
            font-weight: 700;
            color: #667eea;
        }
        .link-reenviar {
            color: #667eea;
            font-size: 13px;
            text-decoration: none;
            font-weight: 600;
        }
        .link-reenviar:hover { text-decoration: underline; }
        .link-volver {
            color: #94a3b8;
            font-size: 12px;
            text-decoration: none;
        }
        .link-volver:hover { color: #475569; }
    </style>
</head>
<body>

<div class="card-2fa">
    <div class="icon-lock">🔐</div>

    <h5 style="text-align:center;font-weight:900;color:#1e293b;margin-bottom:6px;">Verificación en 2 pasos</h5>
    <p style="text-align:center;font-size:13px;color:#64748b;margin-bottom:24px;">
        Ingresa el código de 6 dígitos enviado a<br>
        <strong th:text="${emailMask}">tu correo</strong>
    </p>

    <!-- Alerta: reenviado -->
    <div th:if="${param.reenviado}"
         style="background:rgba(102,126,234,.1);border:1px solid rgba(102,126,234,.35);
                border-radius:8px;padding:10px 14px;margin-bottom:16px;
                color:#4338ca;font-size:13px;text-align:center;">
        ✉ Código reenviado a tu correo.
    </div>

    <!-- Alerta: código incorrecto -->
    <div th:if="${error}"
         style="background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.35);
                border-radius:8px;padding:10px 14px;margin-bottom:16px;
                color:#b91c1c;font-size:13px;text-align:center;">
        ❌ Código incorrecto o expirado. Inténtalo de nuevo.
    </div>

    <form th:action="@{/2fa/verificar}" method="post">
        <input type="text"
               name="codigo"
               class="codigo-input"
               maxlength="6"
               placeholder="------"
               autocomplete="off"
               autofocus
               oninput="this.value=this.value.replace(/\D/g,'')">
        <button type="submit" class="btn-verificar">Verificar acceso</button>
    </form>

    <div class="timer" style="margin-top:18px;">
        El código expira en <span id="countdown">5:00</span>
    </div>

    <div style="text-align:center;margin-top:14px;">
        <form th:action="@{/2fa/reenviar}" method="post" style="display:inline;">
            <button type="submit" style="background:none;border:none;padding:0;"
                    class="link-reenviar">¿No te llegó? Reenviar código</button>
        </form>
    </div>

    <div style="text-align:center;margin-top:16px;">
        <a href="/logout" class="link-volver">← Volver al inicio de sesión</a>
    </div>
</div>

<script>
    let seconds = 5 * 60;
    const el = document.getElementById('countdown');
    const interval = setInterval(() => {
        seconds--;
        if (seconds <= 0) {
            clearInterval(interval);
            el.textContent = '0:00';
            el.style.color = '#ef4444';
            return;
        }
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        el.textContent = m + ':' + String(s).padStart(2, '0');
        if (seconds <= 60) el.style.color = '#ef4444';
    }, 1000);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
