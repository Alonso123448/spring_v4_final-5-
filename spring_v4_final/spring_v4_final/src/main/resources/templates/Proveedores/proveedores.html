<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Proveedores</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        *{ margin:0; padding:0; box-sizing:border-box; }
        body{
            background:
                radial-gradient(circle at top left,#1e3a8a 0%,transparent 25%),
                radial-gradient(circle at bottom right,#7c3aed 0%,transparent 25%),
                #0f172a;
            font-family:'Segoe UI',sans-serif; color:white; min-height:100vh;
        }
        .main{ margin-left:270px; padding:30px; }
        .contenedor{ background:rgba(255,255,255,.06); backdrop-filter:blur(20px);
            border-radius:24px; padding:28px; border:1px solid rgba(255,255,255,.08);
            box-shadow:0 15px 40px rgba(0,0,0,.25); }
        .cabecera{ display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; }
        .cabecera h2{ font-size:32px; font-weight:800;
            text-shadow:0 0 10px rgba(59,130,246,.7),0 0 20px rgba(124,58,237,.5); }
        /* TABLA */
        .table{ color:#e2e8f0; border-collapse:separate; border-spacing:0 8px; }
        .table-light{
            --bs-table-color: #93c5fd !important;
            --bs-table-bg: transparent !important;
            --bs-table-border-color: rgba(255,255,255,.08) !important;
            background:transparent !important; color:#93c5fd !important;
        }
        .table > :not(caption) > * > *{ background-color:transparent !important; }
        .table thead th{ color:#93c5fd !important; font-size:13px; font-weight:700;
            text-transform:uppercase; letter-spacing:1px; padding:12px 16px;
            border:none; background:transparent; }
        .table tbody tr{ background:rgba(255,255,255,.04); transition:.3s; }
        .table tbody tr:hover{ background:rgba(59,130,246,.1); }
        .table tbody td{ padding:13px 16px; font-size:14px; color:#e2e8f0 !important;
            border-color:rgba(255,255,255,.05); vertical-align:middle; }
        .table tbody tr:hover > td{ color:#e2e8f0 !important; }
        /* BADGES */
        .badge{ font-size:12px; font-weight:700; border-radius:20px; padding:5px 14px; }
        .bg-success{ background:rgba(16,185,129,.2) !important; color:#6ee7b7 !important;
            border:1px solid rgba(16,185,129,.3); }
        .bg-danger{ background:rgba(239,68,68,.2) !important; color:#fca5a5 !important;
            border:1px solid rgba(239,68,68,.3); }
        /* BOTONES */
        .btn-icon{ width:36px; height:36px; border:none; border-radius:10px;
            color:white; cursor:pointer; transition:.3s; margin:0 2px; }
        .btn-icon:hover{ transform:translateY(-2px); }
        .btn-editar{ background:linear-gradient(135deg,#f59e0b,#d97706); }
        .btn-ver{ background:linear-gradient(135deg,#0ea5e9,#0284c7); color:white; }
        .btn-eliminar{ background:linear-gradient(135deg,#ef4444,#dc2626); }
        .btn-primary{ background:linear-gradient(135deg,#2563eb,#7c3aed) !important;
            border:none !important; border-radius:14px !important; font-weight:700 !important; }
        .btn-primary:hover{ transform:translateY(-2px); box-shadow:0 8px 20px rgba(99,130,246,.3) !important; }
        .btn-secondary{ background:rgba(255,255,255,.08) !important;
            border:1px solid rgba(255,255,255,.1) !important; color:#94a3b8 !important; border-radius:12px !important; }
        /* CONTROLES */
        .form-select{ background:rgba(255,255,255,.08) !important;
            border:1px solid rgba(255,255,255,.1) !important; color:white !important;
            border-radius:12px; padding:9px 14px; }
        .form-select option{ background:#1e293b; color:white; }
        .form-control{ background:rgba(255,255,255,.08) !important;
            border:1px solid rgba(255,255,255,.1) !important; color:white !important;
            border-radius:12px; padding:9px 14px; }
        .form-control:focus{ background:rgba(255,255,255,.12) !important;
            border-color:#3b82f6 !important; box-shadow:0 0 0 3px rgba(59,130,246,.2) !important; }
        .form-control::placeholder{ color:#64748b; }
        .search-box{ width:260px; }
        /* MODAL */
        .modal-content{ background:#0f172a; border:1px solid rgba(255,255,255,.1);
            border-radius:24px; color:white; }
        .modal-header{ border-bottom:1px solid rgba(255,255,255,.08); padding:20px 24px; }
        .modal-title{ font-weight:800; font-size:20px; }
        .modal-footer{ border-top:1px solid rgba(255,255,255,.08); padding:14px 24px; gap:10px; }
        .btn-close{ filter:invert(1); }
        label{ color:#cbd5e1; font-size:13px; font-weight:600; }
        /* RESPONSIVE */
        @media(max-width:768px){
            .cabecera{ flex-direction:column !important; align-items:flex-start !important; gap:12px; }
            .btn-primary{ width:100%; }
            .search-box{ width:100% !important; }
            .d-flex.justify-content-between{ flex-wrap:wrap; gap:10px; }
            .table thead th{ font-size:11px; padding:8px 10px; }
            .table tbody td{ padding:10px; font-size:12px; }
            .btn-icon{ width:32px; height:32px; }
        }
    </style>
</head>
<body>

<div th:replace="fragments/sidebar :: sidebar"></div>

<div class="main">
    <div class="contenedor">

        <div class="cabecera">
            <h2 class="fw-bold">Listado de Proveedores</h2>
            <button class="btn btn-primary btn-lg" onclick="abrirNuevo()">+ Nuevo Proveedor</button>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                Mostrar
                <select class="form-select d-inline-block w-auto">
                    <option>10</option>
                </select>
                registros
            </div>
            <div class="d-flex align-items-center">
                <label class="me-2">Buscar:</label>
                <input type="text" class="form-control search-box" id="buscarProveedor">
            </div>
        </div>

        <table class="table table-hover align-middle text-center" id="tablaProveedores">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Teléfono</th>
                <th>Dirección</th>
                <th>Email</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${proveedores}">
                <td th:text="${p.id}"></td>
                <td th:text="${p.nombre}"></td>
                <td th:text="${p.telefono}"></td>
                <td th:text="${p.direccion}"></td>
                <td th:text="${p.email}"></td>
                <td>
                    <span th:if="${p.estado}" class="badge bg-success">Activo</span>
                    <span th:unless="${p.estado}" class="badge bg-danger">Inactivo</span>
                </td>
                <td>
                    <!-- Botón Editar Celeste -->
                    <button class="btn-icon btn-editar"
                            th:attr="data-id=${p.id},
                                     data-nombre=${p.nombre},
                                     data-telefono=${p.telefono},
                                     data-direccion=${p.direccion},
                                     data-email=${p.email},
                                     data-estado=${p.estado}"
                            onclick="editarProveedor(this)">
                        ✏
                    </button>

                    <!-- Botón Ver Amarillo -->
                    <button class="btn-icon btn-ver"
                            onclick="verProveedor(this)">👁</button>

                    <!-- Botón Eliminar Rojo -->
                    <button class="btn-icon btn-eliminar"
                            th:attr="data-id=${p.id}"
                            onclick="eliminarProveedor(this)">🗑</button>
                </td>
            </tr>
            </tbody>
        </table>

    </div>
</div>

<!-- MODAL NUEVO / EDITAR PROVEEDOR -->
<div class="modal fade" id="proveedorModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="formProveedor" method="post" th:action="@{/proveedores/guardar}">
                <input type="hidden" id="proveedorId" name="id">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Nuevo Proveedor</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label>Nombre</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" required>
                    </div>
                    <div class="mb-3">
                        <label>Teléfono</label>
                        <input type="text" class="form-control" id="telefono" name="telefono">
                    </div>
                    <div class="mb-3">
                        <label>Dirección</label>
                        <input type="text" class="form-control" id="direccion" name="direccion">
                    </div>
                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email" class="form-control" id="email" name="email">
                    </div>
                    <div class="mb-3">
                        <label>Estado</label>
                        <select class="form-control" id="estado" name="estado">
                            <option value="true">Activo</option>
                            <option value="false">Inactivo</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary" type="submit">Guardar</button>
                    <button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    const modalProveedor = new bootstrap.Modal(document.getElementById('proveedorModal'));

    // Abrir modal nuevo proveedor
    function abrirNuevo(){
        document.getElementById('formProveedor').reset();
        document.getElementById('proveedorId').value = '';
        document.getElementById('modalTitle').textContent = 'Nuevo Proveedor';
        modalProveedor.show();
    }

    // Editar proveedor
    function editarProveedor(btn){
        document.getElementById('proveedorId').value = btn.getAttribute('data-id');
        document.getElementById('nombre').value = btn.getAttribute('data-nombre');
        document.getElementById('telefono').value = btn.getAttribute('data-telefono');
        document.getElementById('direccion').value = btn.getAttribute('data-direccion');
        document.getElementById('email').value = btn.getAttribute('data-email');
        document.getElementById('estado').value = btn.getAttribute('data-estado') === 'true' ? 'true' : 'false';
        document.getElementById('modalTitle').textContent = 'Editar Proveedor';
        modalProveedor.show();
    }

    // Ver info proveedor
    function verProveedor(btn){
        const fila = btn.closest('tr');
        const nombre = fila.children[1].textContent;
        const telefono = fila.children[2].textContent;
        const direccion = fila.children[3].textContent;
        const email = fila.children[4].textContent;
        const estado = fila.children[5].textContent;
        Swal.fire({
            title: nombre,
            html: `<b>Teléfono:</b> ${telefono}<br>
                   <b>Dirección:</b> ${direccion}<br>
                   <b>Email:</b> ${email}<br>
                   <b>Estado:</b> ${estado}`,
            icon: 'info'
        });
    }

    // Eliminar proveedor con SweetAlert2
    function eliminarProveedor(btn){
        const id = btn.getAttribute('data-id');
        Swal.fire({
            title: '¿Eliminar proveedor?',
            text: 'Esta acción no se puede deshacer',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#dc3545',
            cancelButtonColor: '#6c757d',
            confirmButtonText: 'Eliminar',
            cancelButtonText: 'Cancelar'
        }).then((result)=>{
            if(result.isConfirmed){
                window.location.href = '/proveedores/eliminar/' + id;
            }
        });
    }

    // Buscador
    document.getElementById("buscarProveedor").addEventListener("keyup", function(){
        const valor = this.value.toLowerCase();
        const filas = document.querySelectorAll("#tablaProveedores tbody tr");
        filas.forEach(fila => {
            fila.style.display = fila.textContent.toLowerCase().includes(valor) ? "" : "none";
        });
    });
</script>

<script src="/js/main.js"></script>

<script th:inline="javascript" th:if="${error}">
Swal.fire({
    icon: 'error',
    title: 'Proveedor en uso',
    text: /*[[${error}]]*/ '',
    background: '#0f172a',
    color: 'white',
    confirmButtonColor: '#6366f1',
    confirmButtonText: 'Aceptar'
});
</script>

<script th:inline="javascript" th:if="${success}">
Swal.fire({
    icon: 'success',
    title: '¡Listo!',
    text: /*[[${success}]]*/ '',
    background: '#0f172a',
    color: 'white',
    confirmButtonColor: '#6366f1',
    confirmButtonText: 'Aceptar'
});
</script>

</body>
</html>
