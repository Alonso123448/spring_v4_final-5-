<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Proveedor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f6f9;
            font-family:Segoe UI;
        }

        .main{
            margin-left:260px;
            padding:30px;
        }

        .card{
            border:none;
            border-radius:15px;
            box-shadow:0 2px 8px rgba(0,0,0,.1);
        }
    </style>
</head>
<body>

<th:block th:replace="~{fragments/sidebar :: sidebar}"></th:block>

<div class="main">

    <div class="card p-4" style="max-width:700px;">

        <h3 class="mb-4"
            th:text="${proveedor.id == null ? 'Nuevo Proveedor' : 'Editar Proveedor'}">
        </h3>

        <form th:action="@{/proveedores/guardar}"
              th:object="${proveedor}"
              method="post">

            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text"
                       class="form-control"
                       th:field="*{nombre}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Dirección</label>
                <input type="text"
                       class="form-control"
                       th:field="*{direccion}">
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email"
                       class="form-control"
                       th:field="*{email}">
            </div>

            <div class="mb-3">
                <label class="form-label">Teléfono</label>
                <input type="text"
                       class="form-control"
                       th:field="*{telefono}">
            </div>

            <div class="mb-4">
                <label class="form-label">Estado</label>
                <select class="form-control"
                        th:field="*{estado}">
                    <option th:value="true">Activo</option>
                    <option th:value="false">Inactivo</option>
                </select>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    Guardar
                </button>

                <a th:href="@{/proveedores}" class="btn btn-secondary">
                    Volver
                </a>
            </div>

        </form>

    </div>

</div>

</body>
</html>
