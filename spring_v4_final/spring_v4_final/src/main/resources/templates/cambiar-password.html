<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cambiar Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Segoe UI", sans-serif;
        }
        .card-cambio {
            background: white;
            border-radius: 18px;
            padding: 40px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.25);
            width: 100%;
            max-width: 420px;
        }
        .icon-key {
            width: 70px; height: 70px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            font-size: 28px;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 14px;
            border: 2px solid #e2e8f0;
            font-size: 14px;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,.2);
            outline: none;
        }
        .btn-guardar {
            width: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-size: 15px;
            font-weight: 700;
            color: white;
            margin-top: 16px;
            cursor: pointer;
            transition: opacity .2s;
        }
        .btn-guardar:hover { opacity: .88; }
        .requisito { font-size: 12px; color: #94a3b8; margin-top: 8px; }
        .requisito.ok { color: #10b981; }
        .requisito.mal { color: #ef4444; }
    </style>
</head>
<body>

<div class="card-cambio">
    <div class="icon-key">🔑</div>

    <h5 style="text-align:center;font-weight:900;color:#1e293b;margin-bottom:6px;">Cambia tu contraseña</h5>
    <p style="text-align:center;font-size:13px;color:#64748b;margin-bottom:24px;">
        Tu cuenta tiene una contraseña temporal.<br>Debes establecer una nueva para continuar.
    </p>

    <!-- Error -->
    <div th:if="${error}"
         style="background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.35);
                border-radius:8px;padding:10px 14px;margin-bottom:16px;
                color:#b91c1c;font-size:13px;text-align:center;"
         th:text="${error}">
    </div>

    <form action="/cambiar-password" method="post">
        <div class="mb-3">
            <label style="font-size:13px;font-weight:600;color:#475569;">Nueva contraseña</label>
            <input type="password" name="nuevaPassword" id="nueva" class="form-control mt-1"
                   placeholder="Mínimo 6 caracteres" oninput="validar()" required>
        </div>
        <div class="mb-3">
            <label style="font-size:13px;font-weight:600;color:#475569;">Confirmar contraseña</label>
            <input type="password" name="confirmarPassword" id="confirmar" class="form-control mt-1"
                   placeholder="Repite la contraseña" oninput="validar()" required>
        </div>
        <div id="reqLongitud" class="requisito">• Mínimo 6 caracteres</div>
        <div id="reqCoincide" class="requisito">• Las contraseñas deben coincidir</div>

        <button type="submit" class="btn-guardar" id="btnGuardar" disabled>Guardar nueva contraseña</button>
    </form>
</div>

<script>
    function validar() {
        const nueva     = document.getElementById('nueva').value;
        const confirmar = document.getElementById('confirmar').value;
        const okLong    = nueva.length >= 6;
        const okCoin    = nueva === confirmar && confirmar.length > 0;

        const reqLong = document.getElementById('reqLongitud');
        const reqCoin = document.getElementById('reqCoincide');

        reqLong.className = 'requisito ' + (okLong ? 'ok' : 'mal');
        reqCoin.className = 'requisito ' + (okCoin ? 'ok' : 'mal');

        document.getElementById('btnGuardar').disabled = !(okLong && okCoin);
    }
</script>

</body>
</html>
